# Flatpak manifest (Flathub submission later; built out-of-CI for now):
#   flatpak-builder --user --install build-dir packaging/flatpak/com.antigravity.llmerta.yml
app-id: com.antigravity.llmerta
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: llmerta
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.secrets
modules:
  - name: llmerta
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib /app/share/applications /app/share/icons/hicolor/scalable/apps
      - cp -r bundle/* /app/bin/
      - ln -sf /app/bin/llmerta /app/llmerta
      - install -Dm644 com.antigravity.llmerta.desktop /app/share/applications/com.antigravity.llmerta.desktop
      - install -Dm644 llmerta.svg /app/share/icons/hicolor/scalable/apps/llmerta.svg
    sources:
      # Point at an extracted LLMerta_Linux.tar.gz release bundle.
      - type: dir
        path: .
