name: "Spike: secure storage on Linux"

on:
  workflow_dispatch:

jobs:
  no-keyring:
    name: without Secret Service (risk case)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Run spike (no keyring daemon)
        working-directory: spikes/desktop_spikes
        continue-on-error: true
        run: |
          flutter pub get
          xvfb-run -a flutter test integration_test/secure_storage_test.dart -d linux 2>&1 | tee no-keyring.log
      - run: grep 'SPIKE4 RESULT' spikes/desktop_spikes/no-keyring.log || echo "no result line (crashed before print)"

  with-keyring:
    name: with unlocked gnome-keyring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gnome-keyring dbus-x11
      - name: Run spike (headless unlocked keyring)
        working-directory: spikes/desktop_spikes
        run: |
          flutter pub get
          eval "$(dbus-launch --sh-syntax)"
          echo -n "" | gnome-keyring-daemon --unlock
          gnome-keyring-daemon --start --components=secrets &
          xvfb-run -a flutter test integration_test/secure_storage_test.dart -d linux 2>&1 | tee with-keyring.log
      - run: grep 'SPIKE4 RESULT' spikes/desktop_spikes/with-keyring.log
