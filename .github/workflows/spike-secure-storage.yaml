name: "Spike: secure storage on Linux"

on:
  workflow_dispatch:

jobs:
  no-keyring:
    name: without Secret Service (risk case)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Run spike (no keyring daemon)
        working-directory: spikes/desktop_spikes
        continue-on-error: true
        run: |
          flutter pub get
          xvfb-run -a flutter test integration_test/secure_storage_test.dart -d linux 2>&1 | tee no-keyring.log
      - run: grep 'SPIKE4 RESULT' spikes/desktop_spikes/no-keyring.log || echo "no result line (crashed before print)"

  with-keyring:
    # Advisory: headless runners can't convincingly fake a logged-in GNOME
    # session (login keyring stays locked). Happy path is re-verified on a
    # real Linux desktop at M7; the risk case above is the required check.
    name: with unlocked gnome-keyring (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gnome-keyring dbus-x11
      - name: Run spike (headless unlocked keyring)
        working-directory: spikes/desktop_spikes
        run: |
          set -o pipefail
          flutter pub get
          dbus-run-session -- bash -c '
            eval "$(echo -n "" | gnome-keyring-daemon --login)"
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            export GNOME_KEYRING_CONTROL
            xvfb-run -a flutter test integration_test/secure_storage_test.dart -d linux
          ' 2>&1 | tee with-keyring.log
      - run: grep 'SPIKE4 RESULT' spikes/desktop_spikes/with-keyring.log | grep 'roundtrip=true'
