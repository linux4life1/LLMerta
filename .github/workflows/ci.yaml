name: CI

on:
  push:
    branches: [main, claude/mafia-llm-game-project-dcgkza]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # package:sqlite3 dlopens libsqlite3.so; runners ship only the .so.0
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: ./tool/test_all.sh
      # Goldens are rendered and verified on Linux only. First run on a
      # branch without checked-in PNGs bootstraps them; the artifact gets
      # committed and later runs verify against it.
      - name: Goldens (Linux-only required check)
        working-directory: app
        run: |
          if [ ! -d test/golden/goldens ]; then
            flutter test --update-goldens --tags golden
          fi
          flutter test --tags golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens
          path: app/test/golden/goldens/
          if-no-files-found: ignore

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # GStreamer: audioplayers_linux (spike-2 lesson carried into CI).
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter build ${{ matrix.target }} --release
        working-directory: app
        env:
          # audioplayers_windows still uses <experimental/coroutine>;
          # newer MSVC hard-errors without this silencer.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
