name: llmerta_app
description: LLMerta — the social-deduction table where every other seat is an LLM.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  drift: ^2.28.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.3.0
  game_core:
    path: ../packages/game_core
  llm:
    path: ../packages/llm
  path: ^1.9.0
  path_provider: ^2.1.0
  persistence:
    path: ../packages/persistence
  riverpod_annotation: ^3.0.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  build_runner: ^2.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true
