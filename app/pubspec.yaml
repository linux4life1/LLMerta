name: llmerta_app
description: LLMerta — the social-deduction table where every other seat is an LLM.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  game_core:
    path: ../packages/game_core
  llm:
    path: ../packages/llm
  riverpod_annotation: ^3.0.0

dev_dependencies:
  build_runner: ^2.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true
