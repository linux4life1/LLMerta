name: llmerta_app
description: LLMerta — the social-deduction table where every other seat is an LLM.
version: 0.1.8
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  audioplayers: ^6.1.0
  drift: ^2.28.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  freezed_annotation: ^3.0.0
  flutter_secure_storage: ^10.3.0
  game_core:
    path: ../packages/game_core
  http: ^1.6.0
  llm:
    path: ../packages/llm
  memory:
    path: ../packages/memory
  onnxruntime_v2: ^1.23.2+2
  package_info_plus: ^8.3.1
  path: ^1.9.0
  path_provider: ^2.1.0
  persistence:
    path: ../packages/persistence
  riverpod_annotation: ^3.0.0
  sherpa_onnx: ^1.13.4
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  tts:
    path: ../packages/tts

dev_dependencies:
  archive: ^4.0.0
  build_runner: ^2.5.0
  flutter_lints: ^6.0.0
  freezed: ^3.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Limelight.txt
    - assets/fonts/OFL-LibreFranklin.txt
  fonts:
    - family: Limelight
      fonts:
        - asset: assets/fonts/Limelight-Regular.ttf
    - family: LibreFranklin
      fonts:
        - asset: assets/fonts/LibreFranklin.ttf
